metrics:
  min_roe: {column: return_on_equity_pct, op: ">="}
  max_de: {column: debt_to_equity, op: "<="}
  min_fcf: {column: free_cash_flow_cr, op: ">="}
  min_rev_cagr_5yr: {column: revenue_cagr_5yr, op: ">="}
  min_pat_cagr_5yr: {column: pat_cagr_5yr, op: ">="}
  min_opm: {column: operating_profit_margin_pct, op: ">="}
  max_pe: {column: pe_ratio, op: "<="}
  max_pb: {column: pb_ratio, op: "<="}
  min_div_yield: {column: dividend_yield_pct, op: ">="}
  min_icr: {column: interest_coverage, op: ">="}
  min_market_cap: {column: market_cap_crore, op: ">="}
  min_net_profit: {column: net_profit_cr, op: ">="}
  min_eps_cagr: {column: eps_cagr_5yr, op: ">="}
  min_asset_turnover: {column: asset_turnover, op: ">="}
  min_sales: {column: sales_cr, op: ">="}

presets:
  quality_compounder:
    name: "Quality Compounder"
    filters: {min_roe: 15, max_de: 1.0, min_fcf: 0, min_rev_cagr_5yr: 10}
  value_pick:
    name: "Value Pick"
    filters: {max_pe: 20, max_pb: 3.0, max_de: 2.0, min_div_yield: 1}
  growth_accelerator:
    name: "Growth Accelerator"
    filters: {min_pat_cagr_5yr: 20, min_rev_cagr_5yr: 15, max_de: 2.0}
  dividend_champion:
    name: "Dividend Champion"
    filters: {min_div_yield: 2, max_dividend_payout: 80, min_fcf: 0}
  debt_free_blue_chip:
    name: "Debt-Free Blue Chip"
    filters: {max_de: 0, min_roe: 12, min_sales: 5000}
  turnaround_watch:
    name: "Turnaround Watch"
    filters: {min_rev_cagr_3yr: 10, fcf_positive_latest: true, de_declining_yoy: true}